PLG_J2COMMERCE_PAYMENT_ORBONI="Orboni for J2Commerce"
PLG_J2COMMERCE_PAYMENT_ORBONI_XML_DESCRIPTION="Crypto payments for J2Commerce through Orboni: buyers pay with USDT, USDC, BTC, ETH and other coins on Orboni’s payment page, and the money goes straight to your own wallets — Orboni never holds it. Open this plugin’s settings to add your Orboni secret key, then turn it on under J2Commerce → Payment methods."

