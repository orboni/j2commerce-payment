PLG_J2COMMERCE_PAYMENT_ORBONI_WEBHOOK_SECRET="Webhook signing secret"
PLG_J2COMMERCE_PAYMENT_ORBONI_WEBHOOK_SECRET_DESC="In your Orboni dashboard, under Developers → Webhooks, add an endpoint with the webhook address shown below and paste its signing secret (whsec_…) here. Without it orders are marked paid when the buyer comes back to your store or when the cron runs."
